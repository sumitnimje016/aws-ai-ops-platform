name: AWS Terraform

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: aws-ai-ops-app
      ECR_REGISTRY: 335523638530.dkr.ecr.ap-south-1.amazonaws.com
      EC2_INSTANCE_ID: i-0d683f54e86ea1314

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::335523638530:role/GitHubActions-AWS-AIOps
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./app

      - name: Push Docker image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy application to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AWS AI Ops application" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 335523638530.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 335523638530.dkr.ecr.ap-south-1.amazonaws.com/aws-ai-ops-app:latest",
              "docker stop aws-ai-ops-app || true",
              "docker rm aws-ai-ops-app || true",
              "docker run -d --name aws-ai-ops-app --restart unless-stopped -p 8080:8080 335523638530.dkr.ecr.ap-south-1.amazonaws.com/aws-ai-ops-app:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "SSM deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              echo "SSM deployment failed"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for SSM deployment"
          exit 1

      - name: Verify application health
        run: |
          sleep 5
          curl --fail --show-error http://3.111.215.249/health

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
